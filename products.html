<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Archive & Showcase — Paoreel Studios</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&family=Instrument+Serif:ital@0;1&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.5/css/lightbox.min.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/responsive.css">

    <style>
        :root {
            --bg-color: #070707;
            --surface-color: #111111;
            --text-primary: #ffffff;
            --text-secondary: #888888;
            --accent-color: #d4af37;
            --font-serif: 'Instrument Serif', Georgia, serif;
            --font-sans: 'Plus Jakarta Sans', -apple-system, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-sans);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Fix default link styling (prevent blue/purple visited state) */
        a, a:link, a:visited, a:hover, a:active {
            color: inherit;
            text-decoration: none;
        }

        /* Navigation Bar */
        .modern-nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            z-index: 1000;
            background: rgba(7, 7, 7, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .nav-logo {
            font-family: var(--font-serif);
            font-size: 1.8rem;
            letter-spacing: 0.05em;
            color: var(--text-primary) !important;
            text-decoration: none;
        }

        /* Nav links explicit color and active state */
        .nav-links a {
            color: var(--text-secondary) !important;
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            transition: color 0.3s ease;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--text-primary) !important;
        }

        .product-hero {
            padding: 120px 5% 30px 5%;
            max-width: 1440px;
            margin: 0 auto;
        }

        .hero-top-meta {
            font-size: 0.75rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--accent-color);
            margin-bottom: 14px;
            display: block;
        }

        .hero-title {
            font-family: var(--font-serif);
            font-size: clamp(3rem, 7vw, 6rem);
            font-weight: 400;
            line-height: 0.95;
            font-style: italic;
            letter-spacing: -0.02em;
            margin-bottom: 20px;
        }

        /* Gallery */
        .gallery-section {
            padding: 20px 5% 80px 5%;
            max-width: 1440px;
            margin: 0 auto;
        }

        .bento-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 20px;
        }

        .bento-item {
            position: relative;
            background-color: var(--surface-color);
            border-radius: 6px;
            overflow: hidden;
            display: block;
            text-decoration: none;
        }

        .bento-item:nth-of-type(4n-3) { grid-column: span 8; height: 500px; }
        .bento-item:nth-of-type(4n-2) { grid-column: span 4; height: 500px; }
        .bento-item:nth-of-type(4n-1) { grid-column: span 5; height: 420px; }
        .bento-item:nth-of-type(4n)   { grid-column: span 7; height: 420px; }

        .bento-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.8s ease;
        }

        .bento-item:hover img {
            transform: scale(1.03);
        }

        .modern-footer {
            padding: 40px 5%;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        @media (max-width: 900px) {
            .bento-item { grid-column: span 12 !important; height: 350px !important; }
            .modern-footer { flex-direction: column; gap: 10px; text-align: center; }
        }
    </style>
</head>
<body>

    <!-- Navigation -->
    <header>
      <nav class="modern-nav navbar">
          <a href="index.html" class="nav-logo">Paoreel.</a>
          <button class="hamburger" aria-label="Toggle navigation" aria-expanded="false">
              <span class="bar"></span>
              <span class="bar"></span>
              <span class="bar"></span>
          </button>
          <ul class="nav-links">
              <li><a href="index.html">Home</a></li>
              <li><a href="products.html" class="active">Products</a></li>
              <li><a href="portfolio.html">Portfolio</a></li>
              <li><a href="about.html">About</a></li>
              <li><a href="contact.html">Contact</a></li>
          </ul>
      </nav>
    </header>

    <!-- Header Section -->
    <header class="product-hero">
        <span class="hero-top-meta">Commercial Archive</span>
        <h1 class="hero-title">Product Visuals</h1>
    </header>

    <!-- Gallery Grid -->
    <main class="gallery-section">
        <div class="bento-grid" id="dynamic-product-grid"></div>
    </main>

    <!-- Footer -->
    <footer class="modern-footer">
        <p>&copy; <span id="year">2026</span> Paoreel Studios. All Rights Reserved.</p>
        
    </footer>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.5/js/lightbox.min.js"></script>
    <script src="assets/js/navigation.js"></script>
    <script src="assets/js/watermark.js"></script>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        // Configure Lightbox options
        if (typeof lightbox !== "undefined") {
            lightbox.option({
                resizeDuration: 150,
                fadeDuration: 150,
                wrapAround: true,
                disableScrolling: true
            });
        }

       // Persistent & Responsive Lightbox Watermark Injector
document.addEventListener("DOMContentLoaded", () => {
    function stampWatermark() {
        const lbContainer = document.querySelector('.lb-container');
        if (!lbContainer) return;

        if (window.getComputedStyle(lbContainer).position === 'static') {
            lbContainer.style.position = 'relative';
        }

        // Remove duplicates if any exist
        lbContainer.querySelectorAll('.lightbox-watermark').forEach(el => el.remove());

        const watermark = document.createElement('div');
        watermark.className = 'lightbox-watermark';
        watermark.innerText = 'Paoreel Studios — All Rights Reserved';
        watermark.style.cssText = `
            position: absolute;
            bottom: 16px;
            right: 20px;
            max-width: calc(100% - 40px);
            width: fit-content;
            color: rgba(255, 255, 255, 0.85);
            font-family: 'Playfair Display', serif;
            font-size: clamp(0.6rem, 2vw, 0.85rem);
            line-height: 1.2;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            pointer-events: none;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.85);
            z-index: 9999;
        `;
        lbContainer.appendChild(watermark);
    }

    // Check every 100ms when lightbox is displayed to ensure watermark is attached
    setInterval(() => {
        const lightboxEl = document.querySelector('.lightbox');
        if (lightboxEl && window.getComputedStyle(lightboxEl).display !== 'none') {
            const lbContainer = lightboxEl.querySelector('.lb-container');
            if (lbContainer && !lbContainer.querySelector('.lightbox-watermark')) {
                stampWatermark();
            }
        }
    }, 100);
});

        // Dynamic Product Gallery Loader
        document.addEventListener('DOMContentLoaded', () => {
            const gridContainer = document.getElementById('dynamic-product-grid');
            const owner = "clicku";
            const repo = "paoreel";
            const branch = "v2-redesign";
            const folderPath = "assets/images/products";

            fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${folderPath}?ref=${branch}`)
                .then(res => res.json())
                .then(files => {
                    if (!Array.isArray(files)) return;
                    const imageFiles = files.filter(f => f.type === "file" && /\.(webp|jpg|jpeg|png)$/i.test(f.name));

                    if (imageFiles.length === 0) {
                        gridContainer.innerHTML = `<p style="grid-column: span 12; text-align: center; color: #888;">No product images found.</p>`;
                        return;
                    }

                    // Render bento items without text overlays
                    gridContainer.innerHTML = imageFiles.map((file) => {
                        const cleanName = file.name.replace(/\.[^/.]+$/, "").replace(/[-_]/g, " ");
                        const relativePath = `${folderPath}/${file.name}`;

                        return `
                            <a href="${relativePath}" class="bento-item" data-lightbox="product-archive" data-title="Product: ${cleanName}">
                                <img src="${relativePath}" alt="${cleanName}" loading="lazy" decoding="async">
                            </a>
                        `;
                    }).join('');
                })
                .catch(err => console.error("Error loading products:", err));
        });
    </script>
</body>
</html>
