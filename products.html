<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Archive & Showcase — Paoreel Studios</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&family=Instrument+Serif:ital@0;1&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.5/css/lightbox.min.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/responsive.css">

    <style>
        :root {
            --bg-color: #070707;
            --surface-color: #111111;
            --text-primary: #ffffff;
            --text-secondary: #888888;
            --accent-color: #d4af37;
            --font-serif: 'Instrument Serif', Georgia, serif;
            --font-sans: 'Plus Jakarta Sans', -apple-system, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-sans);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Navigation Bar */
        .modern-nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            z-index: 1000;
            background: rgba(7, 7, 7, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .nav-logo {
            font-family: var(--font-serif);
            font-size: 1.8rem;
            letter-spacing: 0.05em;
            color: var(--text-primary);
            text-decoration: none;
        }

        .product-hero {
            padding: 120px 5% 30px 5%;
            max-width: 1440px;
            margin: 0 auto;
        }

        .hero-top-meta {
            font-size: 0.75rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--accent-color);
            margin-bottom: 14px;
            display: block;
        }

        .hero-title {
            font-family: var(--font-serif);
            font-size: clamp(3rem, 7vw, 6rem);
            font-weight: 400;
            line-height: 0.95;
            font-style: italic;
            letter-spacing: -0.02em;
            margin-bottom: 20px;
        }

        /* Gallery */
        .gallery-section {
            padding: 20px 5% 80px 5%;
            max-width: 1440px;
            margin: 0 auto;
        }

        .bento-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 20px;
        }

        .bento-item {
            position: relative;
            background-color: var(--surface-color);
            border-radius: 6px;
            overflow: hidden;
            display: block;
            text-decoration: none;
        }

        .bento-item:nth-of-type(4n-3) { grid-column: span 8; height: 500px; }
        .bento-item:nth-of-type(4n-2) { grid-column: span 4; height: 500px; }
        .bento-item:nth-of-type(4n-1) { grid-column: span 5; height: 420px; }
        .bento-item:nth-of-type(4n)   { grid-column: span 7; height: 420px; }

        .bento-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.8s ease;
        }

        .bento-overlay {
            position: absolute;
            inset: 0;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            background: linear-gradient(180deg, transparent 40%, rgba(0, 0, 0, 0.85) 100%);
        }

        .modern-footer {
            padding: 40px 5%;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        @media (max-width: 900px) {
            .bento-item { grid-column: span 12 !important; height: 350px !important; }
            .modern-footer { flex-direction: column; gap: 10px; text-align: center; }
        }
    </style>
</head>
<body>

    <!-- Navigation -->
    <header>
      <nav class="modern-nav navbar">
          <a href="index.html" class="nav-logo">Paoreel.</a>
          <button class="hamburger" aria-label="Toggle navigation" aria-expanded="false">
              <span class="bar"></span>
              <span class="bar"></span>
              <span class="bar"></span>
          </button>
          <ul class="nav-links">
              <li><a href="index.html">Home</a></li>
              <li><a href="products.html" class="active">Products</a></li>
              <li><a href="portfolio.html">Portfolio</a></li>
              <li><a href="about.html">About</a></li>
              <li><a href="contact.html">Contact</a></li>
          </ul>
      </nav>
    </header>

    <!-- Header Section -->
    <header class="product-hero">
        <span class="hero-top-meta">Commercial Archive</span>
        <h1 class="hero-title">Product Visuals</h1>
    </header>

    <!-- Gallery Grid -->
    <main class="gallery-section">
        <div class="bento-grid" id="dynamic-product-grid"></div>
    </main>

    <!-- Footer -->
    <footer class="modern-footer">
        <p>&copy; <span id="year">2026</span> Paoreel Studios. All Rights Reserved.</p>
        <p>Designed with Modern Editorial Aesthetics</p>
    </footer>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.5/js/lightbox.min.js"></script>
    <script src="assets/js/navigation.js"></script>
    <script src="assets/js/watermark.js"></script>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        document.addEventListener('DOMContentLoaded', () => {
            const gridContainer = document.getElementById('dynamic-product-grid');
            const owner = "clicku";
            const repo = "paoreel";
            const branch = "v2-redesign";
            const folderPath = "assets/images/products";

            fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${folderPath}?ref=${branch}`)
                .then(res => res.json())
                .then(files => {
                    if (!Array.isArray(files)) return;
                    const imageFiles = files.filter(f => f.type === "file" && /\.(webp|jpg|jpeg|png)$/i.test(f.name));

                    if (imageFiles.length === 0) {
                        gridContainer.innerHTML = `<p style="grid-column: span 12; text-align: center; color: #888;">No product images found.</p>`;
                        return;
                    }

                    gridContainer.innerHTML = imageFiles.map((file, index) => {
                        const cleanName = file.name.replace(/\.[^/.]+$/, "").replace(/[-_]/g, " ");
                        const relativePath = `${folderPath}/${file.name}`;

                        return `
                            <a href="${relativePath}" class="bento-item" data-lightbox="product-archive" data-title="Product: ${cleanName}">
                                <img src="${relativePath}" alt="${cleanName}" loading="lazy" decoding="async">
                                <div class="bento-overlay">
                                    <h3 style="font-size: 1.2rem;">${cleanName}</h3>
                                </div>
                            </a>
                        `;
                    }).join('');
                })
                .catch(err => console.error("Error loading products:", err));
        });
    </script>
</body>
</html>
