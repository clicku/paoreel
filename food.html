<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Photography - Paoreel Photography</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.5/css/lightbox.min.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

  <div id="main-content">
    <header>
      <nav class="navbar">
        <div class="logo">
          <a href="/index.html">
            <img src="/assets/images/logo.png" alt="Paoreel Studios Logo">
          </a>
        </div>
        <ul class="nav-links">
          <li><a href="/index.html">Paoreel</a></li>
          <li><a href="/portfolio.html">Portfolio</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </header>
   
            <section class="portfolio-gallery">
          <div class="gallery-header-stack">
            <div class="portfolio-sub-nav">
              <a href="food.html" class="sub-nav-link active">Food</a>
              <span class="sub-nav-divider">/</span>
              <a href="beverages.html" class="sub-nav-link">Beverages</a>
            </div>
            <h2>Collections</h2>
          </div>

          <div class="grid" id="food-archive-grid"></div>
        </section>

    <footer class="footer">
      <p>© 2025 Paoreel Photography | All Rights Reserved</p>
    </footer>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.5/js/lightbox.min.js"></script>

  <script>
    lightbox.option({
      'resizeDuration': 200,
      'fadeDuration': 200,
      'wrapAround': true,
      'disableScrolling': true
    });

    document.addEventListener('DOMContentLoaded', () => {
      const gridContainer = document.getElementById('food-archive-grid');
      let index = 1;

      function tryNextImage() {
        const fullPath = `/assets/images/fnb/food${index}.webp`;
        const imgTest = new Image();

        imgTest.onload = function() {
          const gridItem = document.createElement('div');
          gridItem.className = 'grid-item';

          const anchor = document.createElement('a');
          anchor.href = fullPath;
          anchor.setAttribute('data-lightbox', 'food-archive');
          anchor.setAttribute('data-title', `Food Shot ${index}`);

          const imgElement = document.createElement('img');
          imgElement.src = fullPath;
          imgElement.alt = 'Food Photography';

          anchor.appendChild(imgElement);
          gridItem.appendChild(anchor);
          gridContainer.appendChild(gridItem);

          index++;
          tryNextImage();
        };

        imgTest.onerror = function() {
          console.log(`Food archive loaded completely. Total: ${index - 1}`);
        };

        imgTest.src = fullPath;
      }

      tryNextImage();
    });
  </script>
</body>
</html>
