<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Paoreel Studios | Commercial Photography</title>

    <meta name="description"
          content="Commercial Food, Beverage, Product, and Portrait Photography by Paoreel Studios.">

    <meta name="theme-color"
          content="#000000">

    <!-- =========================
         CSS
    ========================== -->

    <link rel="stylesheet"
          href="assets/css/variables.css">

    <link rel="stylesheet"
          href="assets/css/base.css">

    <link rel="stylesheet"
          href="assets/css/layout.css">

    <link rel="stylesheet"
          href="assets/css/hero.css">

    <link rel="stylesheet"
          href="assets/css/footer.css">

    <link rel="stylesheet"

</head>

<body>

    <!-- ========================================
         Page Loader
    ========================================= -->

    <div id="loader"></div>


    <!-- ========================================
         Site Header
    ========================================= -->

    <header class="site-header">

        <div class="logo">

            <a href="index.html">
                PAOREEL STUDIOS
            </a>

        </div>

        <nav class="main-navigation">

            <a href="food.html">Food</a>

            <a href="beverage.html">Beverage</a>

            <a href="products.html">Products</a>

            <a href="portrait.html">Portrait</a>

        </nav>

    </header>


    <main>


        <!-- ========================================
             Hero
        ========================================= -->

       <section class="hero">

    <div class="hero-background">

        <img src="assets/images/paoreel.webp"
             alt="Paoreel Studios">

    </div>

    <div class="hero-content">

        <p class="hero-label">
            Commercial Photography
        </p>

        <h1 class="hero-title">
            Photography<br>
            that elevates<br>
            brands.
        </h1>

    </div>

</section>



        <!-- ========================================
             Horizontal Gallery
        ========================================= -->

        <section class="gallery-section">

            <div class="gallery-track">


                <a class="gallery-item"
                   href="food.html">

                    <img src="assets/images/gallery-01.jpg"
                         alt="Food Photography">

                    <span>Food Stories</span>

                </a>


                <a class="gallery-item"
                   href="beverage.html">

                    <img src="assets/images/gallery-02.jpg"
                         alt="Beverage Photography">

                    <span>Craft Drinks</span>

                </a>


                <a class="gallery-item"
                   href="products.html">

                    <img src="assets/images/gallery-03.jpg"
                         alt="Product Photography">

                    <span>Clean Products</span>

                </a>


                <a class="gallery-item"
                   href="portrait.html">

                    <img src="assets/images/gallery-04.jpg"
                         alt="Portrait Photography">

                    <span>Real People</span>

                </a>


                <a class="gallery-item"
                   href="food.html">

                    <img src="assets/images/gallery-05.jpg"
                         alt="Food Photography">

                    <span>Fresh Plates</span>

                </a>


                <a class="gallery-item"
                   href="products.html">

                    <img src="assets/images/gallery-06.jpg"
                         alt="Product Photography">

                    <span>Studio Light</span>

                </a>

            </div>

        </section>


    </main>



    <!-- ========================================
         Footer
    ========================================= -->

    <footer class="site-footer">

        <div class="footer-brand">

            <h2>Paoreel Studios</h2>

            <p>
                Commercial Food, Beverage, Product & Portrait Photography.
            </p>

        </div>

        <div class="footer-links">

            <a href="food.html">Food</a>

            <a href="beverage.html">Beverage</a>

            <a href="products.html">Products</a>

            <a href="portrait.html">Portrait</a>

        </div>

    </footer>

         GSAP
    ========================================= -->

    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>


    <!-- ========================================
         Lenis
    ========================================= -->

    <script src="https://unpkg.com/@studio-freight/lenis/dist/lenis.min.js"></script>


    <!-- ========================================
         JavaScript
    ========================================= -->

    <script src="assets/js/loader.js"></script>
