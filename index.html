<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Paoreel Photography</title>

    <link rel="stylesheet" href="/assets/css/style.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Open+Sans:wght@400;600&display=swap"
          rel="stylesheet">

</head>

<body>

    <!-- =======================================================
         PAGE TRANSITION
    ======================================================== -->

    <div class="transition-overlay">

        <div class="transition-column"></div>
        <div class="transition-column"></div>
        <div class="transition-column"></div>

    </div>


    <!-- =======================================================
         HEADER
    ======================================================== -->

    <header id="main-header">

        <nav class="navbar">

            <div class="logo"></div>

            <ul class="nav-links">

                <li>
                    <a href="/about.html">
                        About
                    </a>
                </li>

                <li>
                    <a href="/contact.html">
                        Contact
                    </a>
                </li>

            </ul>

        </nav>

    </header>


    <!-- =======================================================
         HERO
    ======================================================== -->

    <section class="hero">

        <!-- Background Image -->

        <div class="hero-bg-image"></div>

        <!-- Dark Overlay -->

        <div class="hero-overlay"></div>

        <!-- Hero Content -->

        <div class="hero-container">

            <div class="hero-content">

                <h1 class="logo-title">

                    <img
                        src="/assets/images/logo.png"
                        alt="Paoreel Studios">

                </h1>

                <p>

                    Specializing in food and product photography &
                    videography, we craft stunning visuals that
                    highlight flavor, detail and quality for
                    restaurants, hotels, brands and marketing.

                </p>

                <a
                    href="portfolio.html"
                    class="btn"
                    id="portfolio-btn">

                    See Our Portfolio

                </a>

            </div>

        </div>

    </section>


    <!-- =======================================================
         GSAP
    ======================================================== -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <script>

    document.addEventListener("DOMContentLoaded", () => {

    //=========================================================
    // INITIAL STATES
    //=========================================================

    gsap.set(".hero-bg-image", {
        opacity: 0,
        scale: 1.18,
        filter: "blur(40px) brightness(0.15)"
    });

    gsap.set([
        "#main-header",
        ".logo-title img",
        ".hero-content p",
        ".hero-content .btn"
    ], {
        opacity: 0,
        y: 35
    });


    //=========================================================
    // CINEMATIC INTRO
    //=========================================================

    const intro = gsap.timeline({
        defaults: {
            ease: "power2.out"
        }
    });


    //---------------------------------------------------------
    // Fade from black
    //---------------------------------------------------------

    intro.to(".hero-bg-image", {

        opacity: 0.35,
        duration: 1.2,

        filter: "blur(38px) brightness(.35)"

    });


    //---------------------------------------------------------
    // Camera searching for focus
    //---------------------------------------------------------

    intro.to(".hero-bg-image", {

        opacity: 0.15,
        duration: 0.05

    });

    intro.to(".hero-bg-image", {

        opacity: 0.65,
        duration: 0.08

    });

    intro.to(".hero-bg-image", {

        opacity: 0.30,
        duration: 0.05

    });

    intro.to(".hero-bg-image", {

        opacity: 0.80,
        duration: 0.08

    });


    //---------------------------------------------------------
    // Lens breathing
    //---------------------------------------------------------

    intro.to(".hero-bg-image", {

        scale: 1.10,

        duration: 0.40,

        ease: "power1.inOut"

    });

    intro.to(".hero-bg-image", {

        scale: 1.13,

        duration: 0.30,

        ease: "power1.inOut"

    });


    //---------------------------------------------------------
    // Focus lock
    //---------------------------------------------------------

    intro.to(".hero-bg-image", {

        opacity: 1,

        filter: "blur(0px) brightness(1)",

        scale: 1,

        duration: 1.8,

        ease: "power3.out"

    });


    //---------------------------------------------------------
    // Camera flash
    //---------------------------------------------------------

    intro.to(".hero-bg-image", {

        filter: "blur(0px) brightness(1.22)",

        duration: 0.08

    });

    intro.to(".hero-bg-image", {

        filter: "blur(0px) brightness(1)",

        duration: 0.25

    });


    //---------------------------------------------------------
    // Reveal Header
    //---------------------------------------------------------

    intro.to("#main-header", {

        opacity: 1,
        y: 0,
        duration: 0.7

    });


    //---------------------------------------------------------
    // Reveal Logo
    //---------------------------------------------------------

    intro.to(".logo-title img", {

        opacity: 1,

        y: 0,

        duration: 1,

        ease: "power4.out"

    }, "-=0.2");


    //---------------------------------------------------------
    // Reveal Description
    //---------------------------------------------------------

    intro.to(".hero-content p", {

        opacity: 1,

        y: 0,

        duration: 0.8

    }, "-=0.45");


    //---------------------------------------------------------
    // Reveal Button
    //---------------------------------------------------------

    intro.to(".hero-content .btn", {

        opacity: 1,

        y: 0,

        duration: 0.8,

        ease: "back.out(1.7)"

    }, "-=0.35");


    //=========================================================
    // PORTFOLIO PAGE TRANSITION
    //=========================================================

    const portfolioBtn = document.getElementById("portfolio-btn");

    if (portfolioBtn) {

        portfolioBtn.addEventListener("click", function (e) {

            e.preventDefault();

            const targetUrl = this.href;

            const exit = gsap.timeline({

                onComplete() {

                    window.location.href = targetUrl;

                }

            });

            exit.to(".transition-column", {

                scaleY: 1,

                duration: 0.75,

                ease: "power4.inOut",

                stagger: 0.15,

                transformOrigin: "bottom center"

            });

        });

    }


    //=========================================================
    // BACK BUTTON FIX
    //=========================================================

    window.addEventListener("pageshow", function (event) {

        if (event.persisted) {

            gsap.set(".transition-column", {

                scaleY: 0

            });

            gsap.set(".hero-bg-image", {

                opacity: 1,
                scale: 1,
                filter: "blur(0px) brightness(1)"

            });

            gsap.set([

                "#main-header",
                ".logo-title img",
                ".hero-content p",
                ".hero-content .btn"

            ], {

                opacity: 1,
                y: 0

            });

        }

    });

});

    </script>

</body>
</html>
