<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Paoreel Studios specializes in premium food, product, commercial photography and videography.">

    <meta
        name="theme-color"
        content="#000000">

    <title>Paoreel Studios | Photography & Videography</title>

    <!-- Google Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Open+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- CSS -->

    <link
        rel="stylesheet"
        href="assets/css/style.css">

</head>

<body>

    <!-- ==========================================================
         PAGE TRANSITION
    =========================================================== -->

    <div class="transition-overlay">

        <div class="transition-column"></div>
        <div class="transition-column"></div>
        <div class="transition-column"></div>

    </div>

    <!-- ==========================================================
         HEADER
    =========================================================== -->

    <header id="main-header">

        <nav class="navbar">

            <a
                href="index.html"
                class="logo"
                aria-label="Paoreel Home">

                <img
                    src="assets/images/logo.png"
                    alt="Paoreel Studios">

            </a>

            <ul class="nav-links">

                <li>
                    <a href="about.html">
                        About
                    </a>
                </li>

                <li>
                    <a href="portfolio.html">
                        Portfolio
                    </a>
                </li>

                <li>
                    <a href="contact.html">
                        Contact
                    </a>
                </li>

            </ul>

        </nav>

    </header>

    <!-- ==========================================================
         HERO
    =========================================================== -->

    <main>

        <section class="hero">

            <!-- Background -->

            <div class="hero-bg-image"></div>

            <!-- Overlay -->

            <div class="hero-overlay"></div>

            <!-- Lens Vignette -->

            <div class="hero-vignette"></div>

            <!-- Film Grain -->

            <div class="film-grain"></div>

            <!-- Floating Dust -->

            <div class="dust"></div>

            <!-- Hero Content -->

            <div class="hero-container">

                <div class="hero-content">

                    <h1 class="logo-title">

                        <img
                            src="assets/images/logo.png"
                            alt="Paoreel Studios Logo">

                    </h1>

                    <p>

                        Specializing in food, product, commercial,
                        and brand photography & videography.
                        We create cinematic visuals that elevate
                        restaurants, hotels, businesses,
                        and marketing campaigns.

                    </p>

                    <a
                        href="portfolio.html"
                        class="btn"
                        id="portfolio-btn">

                        Explore Portfolio

                    </a>

                </div>

            </div>

        </section>

    </main>

    <!-- ==========================================================
         GSAP
    =========================================================== -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <!-- Main Script -->

    <script src="assets/js/main.js"></script>

</body>

</html>
