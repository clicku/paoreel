<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paoreel Photography</title>
  <link rel="stylesheet" href="/assets/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">

  <style>
    /* --- SYSTEM OVERLAYS FOR THE ELEGANT RAMP TRANSITION --- */
    body {
      background-color: #0b0b0b; /* Ensures initial pitch-black canvas */
      margin: 0;
      padding: 0;
    }

    /* Cinematic Curtain Strips */
    .transition-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 99999;
      pointer-events: none;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
    }

    .transition-column {
      background-color: #ffffff; 
      height: 100%;
      width: 100%;
      transform: scaleY(0);
      transform-origin: bottom center;
    }

    /* Custom tracking style to smoothly minimize the hero banner */
    .cinematic-fade-out {
      opacity: 0;
      transform: translateY(-20px);
      transition: opacity 0.8s cubic-bezier(0.25, 1, 0.5, 1), 
                  transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
    }
  </style>
</head>
<body>

  <div class="transition-overlay">
    <div class="transition-column" id="col-1"></div>
    <div class="transition-column" id="col-2"></div>
    <div class="transition-column" id="col-3"></div>
  </div>

  <div id="page-wrapper">
    <header id="main-header" style="opacity: 0;">
      <nav class="navbar">
        <div class="logo"></div>
        <ul class="nav-links">
          <li><a href="/about.html">About</a></li>
          <li><a href="/contact.html">Contact</a></li>
        </ul>
      </nav>
    </header>

    <section class="hero" id="hero-content-wrapper">
      <div class="hero-bg-image"></div>
      <div class="hero-container">
        <div class="hero-content">
          <h1 class="logo-title">
            <img src="/assets/images/logo.png" alt="Paoreel Studios Logo">
          </h1>
          <p>Specializing in food and product photography & videography, we craft stunning visuals that highlight flavor, detail, and quality—perfect for websites, marketing, and menus.</p>
          <a href="portfolio.html" class="btn" id="portfolio-btn">See Our Portfolio</a>
        </div>
      </div>
    </section>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      
      // ==========================================
      // 1. STRICT SEQUENTIAL PAGE ENTRANCE TIMELINE
      // ==========================================
      const entranceTimeline = gsap.timeline();

      // STEP 1: INITIAL BLURRY REVEAL (No Text, No Flicker Yet)
      // Smoothly bring the background from 0 to 0.4 opacity while keeping it heavily blurred (20px)
      entranceTimeline.to(".hero-bg-image", {
        opacity: 0.4,
        filter: "blur(20px)",
        duration: 0.6,
        ease: "power1.inOut"
      });

      // STEP 2: THE CAMERA SHUTTER FLICKER & FOCUS RESOLVE
      // The background image begins flashing/flickering while the blur decreases step-by-step
      entranceTimeline
        .to(".hero-bg-image", { opacity: 0.7, filter: "blur(15px)", duration: 0.15 })
        .to(".hero-bg-image", { opacity: 0.2, filter: "blur(16px)", duration: 0.05 }) // Flicker Drop 1
        .to(".hero-bg-image", { opacity: 0.8, filter: "blur(10px)", duration: 0.15 })
        .to(".hero-bg-image", { opacity: 0.3, filter: "blur(11px)", duration: 0.05 }) // Flicker Drop 2
        .to(".hero-bg-image", { opacity: 0.9, filter: "blur(5px)", duration: 0.2 })
        .to(".hero-bg-image", { opacity: 0.5, filter: "blur(6px)", duration: 0.08 })  // Quick shutter flutter
        .to(".hero-bg-image", { opacity: 1, filter: "blur(0px)", duration: 0.6, ease: "power2.out" });

      // STEP 3: THE PARALLAX ZOOM SETTLE (Runs seamlessly across the stages above)
      entranceTimeline.to(".hero-bg-image", {
        scale: 1,
        duration: 2.2,
        ease: "power1.out"
      }, 0);

      // STEP 4: INTERFACE TEXT REVEAL (Strictly triggers ONLY when background is crystal clear)
      entranceTimeline
        .to(".logo-title img", {
          opacity: 1,
          y: 0,
          duration: 0.8,
          ease: "power4.out"
        }) // The logo animates first
        .to([".hero-content p", "#main-header"], {
          opacity: 1,
          y: 0,
          duration: 0.8,
          ease: "power4.out"
        }, "-=0.3") // The body paragraphs follow right behind
        .to(".hero-content .btn", {
          opacity: 1,
          y: 0,
          duration: 0.7,
          ease: "back.out(1.5)"
        }, "-=0.4"); // The Call-To-Action button arrives last with a micro-bounce

      // ==========================================
      // 2. PREMIUM CURTAIN ROUTING SWEEP
      // ==========================================
      const portfolioBtn = document.getElementById('portfolio-btn');
      
      if (portfolioBtn) {
        portfolioBtn.addEventListener('click', function(e) {
          e.preventDefault();
          const targetUrl = this.getAttribute('href');

          document.getElementById('hero-content-wrapper').classList.add('cinematic-fade-out');
          
          const mainHeader = document.getElementById('main-header');
          if (mainHeader) mainHeader.classList.add('cinematic-fade-out');

          const exitTimeline = gsap.timeline({
            onComplete: () => {
              window.location.href = targetUrl;
            }
          });

          exitTimeline.to(".transition-column", {
            duration: 0.8,
            scaleY: 1,
            transformOrigin: "bottom center",
            ease: "power4.inOut",
            stagger: 0.15 
          });
        });
      }
    });

    // ==========================================
    // 3. BACK-BUTTON HISTORY CACHE RECOVERY
    // ==========================================
    window.addEventListener('pageshow', (event) => {
      if (event.persisted) {
        gsap.set(".transition-column", { scaleY: 0 });
        
        const heroWrapper = document.getElementById('hero-content-wrapper');
        const mainHeader = document.getElementById('main-header');
        
        if (heroWrapper) heroWrapper.classList.remove('cinematic-fade-out');
        if (mainHeader) mainHeader.classList.remove('cinematic-fade-out');
        
        gsap.set([".logo-title img", ".hero-content p", ".hero-content .btn", "#main-header"], { 
          opacity: 1, 
          y: 0 
        });
        gsap.set(".hero-bg-image", { scale: 1, opacity: 1, filter: "blur(0px)" });
      }
    });
  </script>
</body>
</html>
