backend:
  name: github
  repo: clicku/paoreel
  branch: main
  base_url: https://paoreel-cms-oauth.YOUR-SUBDOMAIN.workers.dev # Your Cloudflare Worker URL
  auth_endpoint: auth

media_folder: "assets/images"
public_folder: "assets/images"

collections:
  - name: "content"
    label: "Site Content"
    files:
      - file: "content.json"
        label: "Pages Data"
        name: "pages_data"
        fields:
          - {label: "Hero Subtitle", name: "hero_subtitle", widget: "string"}
          - {label: "Hero Title", name: "hero_title", widget: "string"}
          - {label: "Hero Description", name: "hero_desc", widget: "text"}