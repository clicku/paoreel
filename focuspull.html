<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paoreel Studios - Working Test</title>
  
  <!-- GSAP & ScrollTrigger CDN Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b0b0b;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
    }

    .hero-placeholder {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      border-bottom: 1px solid #222;
    }

    .hero-placeholder h1 {
      font-size: 1.5rem;
      letter-spacing: 0.1em;
      color: #888;
      text-transform: uppercase;
    }

    .gallery-intro {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 2rem;
      background: #0b0b0b;
    }

    .gallery-intro-container {
      display: grid;
      grid-template-columns: 1.4fr 0.9fr;
      align-items: center;
      gap: 3rem;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
    }

    .gallery-copy {
      font-size: clamp(1.5rem, 2.2vw, 2rem);
      line-height: 1.5;
      color: #e0e0e0;
    }

    /* Base style for lines before JS splits them */
    .gallery-copy .line {
      display: block;
      will-change: clip-path, opacity;
    }

    .gallery-title {
      font-size: clamp(2.8rem, 5vw, 5rem);
      font-weight: 300;
    }
  </style>
</head>
<body>

  <section class="hero-placeholder">
    <h1>Scroll Down to Trigger Animation 👇</h1>
  </section>

  <!-- Pinned Section -->
  <section class="gallery-intro">
    <div class="gallery-intro-container">
      <div class="gallery-intro-left">
        <p class="gallery-copy">Commercial photography crafted for modern brands. From restaurants and cafés to premium products and authentic portraits, we create imagery that tells compelling visual stories and elevates every brand.</p>
      </div>
      <div class="gallery-intro-right">
        <h2 class="gallery-title">Studios V5<br>Collection</h2>
      </div>
    </div>
  </section>

  <section class="hero-placeholder" style="background: #080808;">
    <h1>End of Section 👆</h1>
  </section>

  <script>
    console.log("Script file parsed successfully.");

    window.GalleryIntro = (() => {
      "use strict";

      function init() {
        console.log("GalleryIntro init() called.");

        if (!window.gsap || !window.ScrollTrigger) {
          console.error("GSAP or ScrollTrigger missing from window scope!");
          return;
        }

        const section = document.querySelector(".gallery-intro");
        const paragraph = document.querySelector(".gallery-copy");

        if (!section || !paragraph) {
          console.error("Required DOM elements (.gallery-intro or .gallery-copy) not found!");
          return;
        }

        gsap.registerPlugin(ScrollTrigger);

        // Split paragraph text into sentences cleanly
        const text = paragraph.textContent.trim();
        const sentences = text.split(/(?<=[.!?])\s+/);
        
        paragraph.innerHTML = sentences
          .map((sentence) => `<span class="line" style="display: block;">${sentence}</span>`)
          .join(" ");

        const copyLines = paragraph.querySelectorAll(".line");
        console.log("Lines generated for animation:", copyLines.length);

        // Set initial hidden curtain state
        gsap.set(copyLines, {
          clipPath: "inset(0 50% 0 50%)",
          opacity: 0
        });

        // Build scrubbable pinned timeline
        const timeline = gsap.timeline({
          scrollTrigger: {
            trigger: section,
            start: "top top",
            end: "+=900",
            pin: true,
            scrub: 1.5,
            markers: true, // Shows visual trigger debugging lines on screen
            onToggle: (self) => console.log("Pin active state:", self.isActive),
            onUpdate: (self) => console.log("Scroll progress:", self.progress.toFixed(2))
          }
        });

        timeline.to(copyLines, {
          clipPath: "inset(0 0% 0 0%)",
          opacity: 1,
          duration: 1,
          ease: "none",
          stagger: 0.3
        });

        ScrollTrigger.refresh();
        console.log("ScrollTrigger setup complete.");
      }

      return { init };
    })();

    // Force execution on load
    window.addEventListener("DOMContentLoaded", () => {
      window.GalleryIntro.init();
    });
  </script>

</body>
</html>
