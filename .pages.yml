# .pages.yml
branch: v2-redesign

media:
  - name: images
    label: All Images
    input: assets/images
    output: /assets/images
    categories: [image]

  - name: fnb
    label: Food & Beverage
    input: assets/images/fnb
    output: /assets/images/fnb
    categories: [image]

  - name: food
    label: Food
    input: assets/images/food
    output: /assets/images/food
    categories: [image]

  - name: gallery
    label: Gallery
    input: assets/images/gallery
    output: /assets/images/gallery
    categories: [image]

  - name: portraits
    label: Portraits
    input: assets/images/portraits
    output: /assets/images/portraits
    categories: [image]

  - name: products
    label: Products
    input: assets/images/products
    output: /assets/images/products
    categories: [image]

content:
  - name: portfolio-items
    label: Selected Works Manager
    type: file
    path: data/portfolio.json
    fields:
      - name: items
        label: Portfolio Grid Items
        type: list
        fields:
          - name: title
            label: Project Title
            type: string
          - name: category
            label: Category Label
            type: string
          - name: image
            label: Image Path (e.g. assets/images/fnb/my-custom-name.webp)
            type: string
          - name: link
            label: Link Target (e.g. food.html)
            type: string