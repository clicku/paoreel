# .pages.yml
media:
  input: assets                  # The folder where CMS uploads files
  output: /assets                # The public URL path referenced on your site

content:
  - name: fnb-images
    label: Food & Beverage Images
    type: media
    path: assets/fnb

  - name: food-images
    label: Food Images
    type: media
    path: assets/food

  - name: gallery-images
    label: Gallery Images
    type: media
    path: assets/gallery

  - name: portraits-images
    label: Portraits Images
    type: media
    path: assets/portraits

  - name: products-images
    label: Products Images
    type: media
    path: assets/products